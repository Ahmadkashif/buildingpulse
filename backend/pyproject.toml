[project]
name = "buildingpulse-backend"
version = "0.1.0"
description = "BuildingPulse backend — Site EUI prediction API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-q",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes + pycodestyle
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ANN",              # flake8-annotations (require type hints)
    "SIM",              # simplify
    "TID",              # tidy imports
    "RUF",              # ruff-specific
    "S",                # bandit (security)
    "PT",               # pytest style
]
ignore = [
    "ANN401",           # allow Any in explicit cases
    "S101",             # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
