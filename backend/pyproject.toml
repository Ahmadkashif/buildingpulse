[project]
name = "buildingpulse-backend"
version = "0.1.0"
description = "BuildingPulse backend — Site EUI prediction API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
    "structlog>=25.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlite3>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "mutmut>=3.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-q",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes + pycodestyle
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ANN",              # flake8-annotations (require type hints)
    "SIM",              # simplify
    "TID",              # tidy imports
    "RUF",              # ruff-specific
    "S",                # bandit (security)
    "PT",               # pytest style
]
ignore = [
    "ANN401",           # allow Any in explicit cases
    "S101",             # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
ignore_missing_imports = true

# Per-layer coverage rubric — sourced from prd.md "Coverage rubric (per layer)".
# pytest-cov can report coverage but cannot express per-path thresholds.
# `scripts/cov_rubric.py` reads this section and enforces the targets after
# `pytest --cov` produces `coverage.xml`. See `make test`.
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/main.py",
    "app/deps.py",
    "app/__init__.py",
    "app/*/__init__.py",
    "app/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"

# Per-layer thresholds enforced by scripts/cov_rubric.py.
# Format: glob → {kind: branch|line|statement, min: 0.0–1.0}.
[tool.coverage_rubric]
"app/domain/**" = { kind = "branch", min = 1.00 }
"app/policy/**" = { kind = "statement", min = 1.00 }
"app/services/usecase/**" = { kind = "branch", min = 1.00 }
"app/services/resource/**" = { kind = "branch", min = 1.00 }
"app/repos/**" = { kind = "line", min = 1.00 }
"app/integrations/**" = { kind = "line", min = 1.00 }
"app/api/v1/**/controller.py" = { kind = "branch", min = 1.00 }
"app/schemas/**" = { kind = "statement", min = 1.00 }

[tool.mutmut]
paths_to_mutate = ["app/domain", "app/services/resource/lead"]
tests_dir = ["tests/unit/domain", "tests/unit/services/resource/lead"]
